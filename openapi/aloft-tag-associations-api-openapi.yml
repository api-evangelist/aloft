openapi: 3.0.0
info:
  title: Aloft API V1 Accounts Tag Associations API
  contact:
    email: support@aloft.ai
  version: 1.0.0
  description: Accounts
tags:
- name: Tag Associations
  description: Tag Associations
paths:
  /v1/account/{account_id}/{model_type}/{model_id}/tag/{tag_id}:
    post:
      tags:
      - Tag Associations
      summary: Creates an association between a tag and an api resource.
      description: Creates an association between a tag and an api resource.
      operationId: bc2af9ea842e3f1c6a9bc34b4aa0a849
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#components/schemas/model_id'
      - name: model_type
        in: path
        description: The type of model
        required: true
        schema:
          type: string
          enum:
          - aircraft
          - battery
          - checklist
          - flight
          - incident
          - maintenance
          - mission
          - risk-assessment
          - user
          - workflow
      - name: model_id
        in: path
        description: The id of the resource
        required: true
        schema:
          type: integer
      - name: tag_id
        in: path
        description: The id of the tag.
        required: true
        schema:
          type: integer
      responses:
        '403':
          description: Access Denied
        '401':
          description: Unauthorized
        '400':
          description: Invalid Request
        '204':
          description: Successful operation
      security:
      - Aloft Token: []
    delete:
      tags:
      - Tag Associations
      summary: Deletes an association between a tag and an api resource.
      description: Deletes an association between a tag and an api resource.
      operationId: 27921ce61150db6533ab8d8087cf6a0b
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#components/schemas/model_id'
      - name: model_type
        in: path
        description: The type of model
        required: true
        schema:
          type: string
          enum:
          - aircraft
          - battery
          - checklist
          - flight
          - incident
          - maintenance
          - mission
          - risk-assessment
          - user
          - workflow
      - name: model_id
        in: path
        description: The id of the resource
        required: true
        schema:
          type: integer
      - name: tag_id
        in: path
        description: The id of the tag.
        required: true
        schema:
          type: integer
      responses:
        '403':
          description: Access Denied
        '401':
          description: Unauthorized
        '204':
          description: Successful operation
      security:
      - Aloft Token: []
components:
  securitySchemes:
    Aloft Token:
      type: http
      name: Aloft Token
      in: header
      scheme: bearer
