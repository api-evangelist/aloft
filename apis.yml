aid: aloft
name: Aloft
description: >-
  Aloft (aloft.ai, formerly Kittyhawk.io) is the leading FAA-approved provider of
  drone airspace and fleet-management software in the United States, powering the
  majority of LAANC airspace authorizations and unmanned traffic management (UTM)
  for government, public-safety, enterprise, and recreational drone pilots. The
  Aloft API V1 is an http-bearer-authenticated REST API exposing 180 operations
  across 36 resource groups: airspace advisories and weather, LAANC / Notify & Fly,
  flights and flight logs, aircraft, batteries and maintenance, missions, risk
  assessments, checklists, incidents, alerts, files, workflows, and map tile
  layers. Aloft is SOC 2 Type II and ISO 27001 certified. This profile was enriched
  by the API Evangelist pipeline from Aloft's public OpenAPI and developer surface.
url: https://raw.githubusercontent.com/api-evangelist/aloft/refs/heads/main/apis.yml
